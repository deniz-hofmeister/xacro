name: Feature request
description: Propose an addition or change to the xacro crate
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: >-
        Before proposing, check the README's **Non-Goals** section — it is
        load-bearing. Python-based evaluation, rospack-based resolution, and
        Windows compatibility are deliberately out of scope and will not be
        implemented.
  - type: textarea
    id: use-case
    attributes:
      label: Problem / use case
      description: >-
        What problem does this solve? Describe what you are trying to do,
        not only the feature you have in mind. A xacro document that needs
        the feature is ideal.
    validations:
      required: true
  - type: textarea
    id: api-sketch
    attributes:
      label: Proposed API sketch
      description: Optional — a rough sketch of the API you would expect.
      render: rust
    validations:
      required: false
